name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Sync Files to src
        run: |
          # Copy READMEs
          # Transform links to point to GitHub repo for notebooks instead of local relative paths (optional but good for docs)
          # OR just copy them as is, but links to .ipynb won't render in mdbook.
          # For now, let's just copy the texts.
          cp README_ko.md src/README.md
          cp "Data Preprocessing, Cleaning & Transformation/README_ko.md" src/transformation.md

      - name: Build mdBook
        run: mdbook build
        env:
          MDBOOK_LOG: debug

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
